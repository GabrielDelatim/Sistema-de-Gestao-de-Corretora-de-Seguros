{% extends "layout/base.html" %}
{% block titulo %}Erro interno{% endblock %}
{% block conteudo %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center;">
  <span style="font-size:64px;">⚠️</span>
  <h1 style="font-size:28px;font-weight:700;">Erro interno no servidor</h1>
  <p style="color:var(--text-muted);max-width:420px;">
    Algo inesperado aconteceu. O erro foi registrado nos logs do sistema.
    Tente novamente ou contate o administrador.
  </p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Voltar ao Dashboard</a>
</div>
{% endblock %}
